# ===== Какие боты запускает ЗАПУСК.bat =====
spot_enabled: false             # true = снова запускать спот-бот (регулярная покупка BTC). Сейчас выключен.

# ===== Настройки DCA-бота (спот BTC/USDT, без плеча) =====
symbol: BTCUSDT
category: spot            # только спот. Другие значения бот отвергает.

limits:
  max_total_budget_usdt: 1000   # жёсткий потолок: больше этой суммы бот не потратит никогда
  max_order_usdt: 50            # максимум на одну покупку
  min_order_usdt: 5             # меньше — ордер не отправляется (минимум биржи)

dca:
  interval_days: 7              # регулярная покупка раз в N дней
  # сумма регулярной покупки. null = бюджет * base_share / число периодов
  base_order_usdt: null
  base_share: 0.7               # доля бюджета на регулярные покупки (остальное — резерв на просадки)
  horizon_days: 730             # на какой срок растягиваем бюджет

dips:
  enabled: true
  lookback_days: 30             # "недавний максимум" = максимум цены закрытия за N дней
  level_cooldown_days: 7        # один и тот же уровень просадки не срабатывает чаще раза в N дней
  # уровень просадки от недавнего максимума -> сумма доп. покупки.
  # Каждый уровень срабатывает 1 раз, пока цена не обновит максимум.
  levels:
    - {drawdown_pct: 5,  order_usdt: 15}
    - {drawdown_pct: 10, order_usdt: 25}
    - {drawdown_pct: 20, order_usdt: 40}

take_profit:
  enabled: false                # по умолчанию выключено
  trigger_pct: 50               # цена выше средней цены входа на N%
  sell_fraction: 0.2            # продать такую долю BTC
  cooldown_days: 30             # не чаще раза в N дней

fees:
  taker_pct: 0.1                # комиссия Bybit спот (тейкер) для бэктеста

mode:
  # backtest | testnet. live разрешён ТОЛЬКО если live_enabled: true
  # И при запуске указан флаг --i-understand-real-money
  live_enabled: false
  state_file: state.json

# ===== Стратегия фьючерсного бота (bybit_futures_bot.py, только демо-счёт) =====
futures_strategy:
  mode: active                  # active = пробой по тренду; ema_cross = старая стратегия (редкие сделки)
  profile: aggressive           # aggressive = ДЕМО-эксперимент Максима; normal = обычный (риск до 2%)
  risk_pct: 10                  # риск на сделку, % капитала. normal: не больше 2, aggressive: не больше 10.
                                # Плечо всё равно не больше 3x, поэтому реальный риск обычно 4-7%.
  max_positions: 8              # одновременно позиций (бот не даст больше 8)
  daily_min_trade: true         # если за 24 часа не было входа — открыть самый сильный сетап по тренду
  coins:                        # монеты (имя фьючерса Bybit без USDT). Не найденные на Bybit бот пропустит.
    [ETH, SOL, XRP, BNB, DOGE, ADA, AVAX, LINK,
     1000PEPE, WIF, 1000BONK, SHIB1000, 1000FLOKI,
     SUI, NEAR, APT, ARB, OP, INJ, TIA, LTC, DOT, TRX, BCH, ETC, ATOM, UNI, AAVE, SEI, WLD, ENA, HBAR, FIL]
  active:
    breakout_n: 30              # пробой максимума/минимума последних 30 свечей 4h (5 дней)
    sl_atr: 3                   # стоп = 3 ATR(14) от входа
    tp_atr: 4                   # тейк = 4 ATR(14) от входа
    max_hold_bars: 30           # закрыть по времени через 30 свечей 4h (5 дней)

# ===== Защита фьючерсного бота (bybit_futures_bot.py, только демо-счёт) =====
# Касается только НОВЫХ входов. Открытые позиции эти настройки не закрывают
# (кроме close_all_enabled, который по умолчанию выключен).
futures_protection:
  regime_filter:                # фильтр режима рынка: оценка 0-100 (тренд BTC + сколько монет выше EMA200)
    enabled: false              # в агрессивном профиле выключен (берём все сигналы)
    block_longs_below: 20       # оценка <= 20 (сильный медвежий рынок): новые лонги запрещены
    halve_longs_below: 40       # оценка < 40: новые лонги половинным размером
    halve_shorts_above: 60      # оценка > 60: новые шорты половинным размером
    block_shorts_above: 80      # оценка >= 80 (сильный бычий рынок): новые шорты запрещены
    weight_fear_greed: 0        # 0 = индекс страха и жадности не учитывается
  circuit_breaker:              # аварийный стоп по просадке капитала
    enabled: true
    daily_limit_pct: 100        # 100 = дневной стоп выключен (обычный профиль: 5)
    peak_limit_pct: 30          # -30% от максимума -> новых входов нет до ручного сброса (файл сброс_стопа.txt)
    close_all_enabled: false    # true = при close_all_pct закрыть все позиции бота по рынку
    close_all_pct: 40
  pre_trade_gate:               # проверка перед КАЖДОЙ сделкой (и сделкой дня); не меняет риск/профиль, только не пускает явно плохие ордера
    enabled: true
    min_rr: 1.2                 # тейк должен быть хотя бы в 1.2 раза дальше стопа
    risk_tolerance_pct: 10      # убыток на стопе <= risk_pct (+10% допуска на округление)
    total_risk_cap_pct_aggressive: 40   # суммарный риск всех открытых позиций, % капитала (агрессивный профиль)
    total_risk_cap_pct_normal: 6        # то же для обычного профиля
    max_same_direction: 0       # 0 = без лимита позиций в одну сторону (только предупреждение в окне)
    max_spread_pct: 0.3         # спред больше 0.3% -> монету пропускаем (мало ликвидности)
    cooldown_bars: 2            # после стоп-аута по монете не входить 2 свечи 4h (8 часов)
